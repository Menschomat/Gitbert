[project]
name = "gitbert"
version = "0.1.0"
description = "Gitbert: Google ADK 2.0 AI code review agent managed by uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
gitbert = "main:main"
git-bot = "main:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitbert"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
